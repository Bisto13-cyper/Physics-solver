<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=STIX+Two+Text:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ECF0F3; --sheet:#F9FBFC; --ink:#17212B; --muted:#5B6874; --line:#C9D3DB;
  --given:#2A47D6;  --given-tint:#E3E8FB;
  --solved:#0077FF; --solved-tint:#DAF1E7; --solved-line:#9ED8C3;
  --alert:#B93424;  --alert-tint:#FBE2DC;
  --ui:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --sym:'STIX Two Text','Times New Roman',Georgia,serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--ui);color:var(--ink);line-height:1.55;background-color:var(--paper);
  background-image:linear-gradient(rgba(42,71,214,.06) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(42,71,214,.06) 1px,transparent 1px);
  background-size:24px 24px;
}
:focus-visible{outline:3px solid rgba(42,71,214,.45);outline-offset:2px}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 56px}

.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.top h1{font-size:24px;font-weight:600;line-height:1.2}
.top p{color:var(--muted);font-size:14px;margin-top:2px}
.actions{display:flex;gap:8px;align-items:center}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.ghost:hover{border-color:var(--ink)}
.lang-select{background:transparent;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;font-family:inherit}
.lang-select:hover{border-color:var(--ink)}
.seg{display:inline-flex;background:#DCE3E9;border-radius:10px;padding:3px;margin-top:16px}
.seg button{border:0;background:transparent;padding:8px 18px;border-radius:8px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px rgba(23,33,43,.18)}

.layout{display:grid;gap:16px;margin-top:16px;grid-template-columns:minmax(0,1fr);
  grid-template-areas:"picker" "result" "inputs"}
.layout.mode-all{grid-template-areas:"result" "inputs"}
#picker{grid-area:picker} #result{grid-area:result} #inputs{grid-area:inputs}
@media(min-width:900px){
  .layout{grid-template-columns:minmax(0,1.25fr) minmax(330px,.75fr);align-items:start;
    grid-template-areas:"picker result" "inputs result"}
  .layout.mode-all{grid-template-areas:"inputs result"}
  #result{position:sticky;top:16px}
}
.lbl{font-size:16px;font-weight:600;margin-bottom:10px}
.hint{font-size:13px;color:var(--muted);font-weight:400;margin-inline-start:8px}

.sym{--c:var(--given);--t:var(--given-tint);flex:none;display:grid;place-items:center;width:44px;height:44px;
  border-radius:8px;border:1.5px solid var(--c);background:var(--t);color:var(--c);
  font:italic 600 22px/1 var(--sym)}
.sym.long{font-size:17px}
.sym.s{--c:var(--solved);--t:var(--solved-tint)}
.sym.a{--c:var(--alert);--t:var(--alert-tint)}
.sym.sm{width:30px;height:30px;border-radius:6px;font-size:15px}
.sym.sm.long{font-size:12px}
.sym.big{width:56px;height:56px;border-radius:10px;font-size:28px}
.sym.big.long{font-size:21px}

.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-height:70px;
  padding:8px 4px 6px;background:var(--sheet);border:1.5px solid var(--line);border-radius:8px;cursor:pointer;
  transition:background .15s,border-color .15s}
.pick:hover{border-color:var(--solved)}
.pick .s{font:italic 600 22px/1.1 var(--sym)}
.pick .s.long{font-size:18px}
.pick .n{font-size:11px;line-height:1.3;color:var(--muted);text-align:center}
.pick[aria-pressed="true"]{background:var(--solved);border-color:var(--solved);color:#fff}
.pick[aria-pressed="true"] .n{color:#DDF5EC}

@media(max-width:899px){
  .pick-grid{display:flex;overflow-x:auto;gap:8px;padding-bottom:6px;scroll-snap-type:x proximity}
  .pick{flex:0 0 76px;scroll-snap-align:start}
}

.group+.group{margin-top:16px}
.gt{font-size:14px;font-weight:600;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.gt::after{content:"";flex:1;height:1px;background:var(--line)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.field{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--sheet);
  border:1.5px solid var(--line);border-radius:10px;cursor:text;transition:border-color .15s,background .15s}
.field[hidden]{display:none}
.field:focus-within{border-color:var(--given);box-shadow:0 0 0 3px rgba(42,71,214,.14)}
.field.filled{border-color:var(--given);background:#F3F5FE}
.field.bad{border-color:var(--alert);background:#FEF4F2}
.field .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.field .nm{font-size:12px;color:var(--muted);line-height:1.3}
.field input{width:100%;border:0;background:transparent;outline:0;padding:2px 0;color:var(--ink);
  font:500 19px/1.3 var(--ui);font-variant-numeric:tabular-nums;text-align:right}
.field input::placeholder{color:#AAB5BF}
.field .un{min-width:34px;font-size:14px;color:var(--muted);direction:ltr;text-align:left}
.note{margin-top:14px;font-size:13px;color:var(--muted)}

.card{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.card.ok{border-color:var(--solved)}
.card.bad{border-color:var(--alert);background:#FEF6F4}
.card.empty{border-style:dashed;color:var(--muted);display:flex;align-items:center;gap:12px}
.res-head{display:flex;align-items:center;gap:14px}
.res-name{font-size:13px;color:var(--muted)}
.res-val{direction:ltr;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.res-val .num{font-size:38px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.res-val .unit{font-size:18px;color:var(--muted)}
.insuff{direction:ltr;text-align:right;font-size:24px;font-weight:600;color:var(--alert);line-height:1.2}
.sub{font-size:14px;font-weight:600;margin-top:16px}
sup{font-size:.6em;line-height:0}

.steps{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:10px}
.steps li{direction:ltr;text-align:left;padding-left:12px;border-left:3px solid var(--solved-line)}
.steps .f{font-size:13px;color:var(--muted)}
.steps .v{font-size:16px;font-variant-numeric:tabular-nums}

.hints{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.hints li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;
  border:1px solid #EBC3BC;border-radius:8px;background:#fff}
.hints .f{direction:ltr;font-size:15px}
.hints .miss{display:flex;gap:4px}

.warn{margin-top:14px;padding:10px 12px;border-radius:10px;background:#FFF3D6;border:1px solid #E7CB7E;font-size:14px}
.warn ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px}

.all-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.all-head h2{font-size:16px;font-weight:600}
.chip{background:var(--solved-tint);color:var(--solved);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:600}
.rlist{display:grid;gap:8px}
.rtile{border:1.5px solid var(--solved-line);border-radius:10px;background:#F3FBF7}
.rtile summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer}
.rtile summary::-webkit-details-marker{display:none}
.rtile summary::after{content:"";width:7px;height:7px;border-inline-end:2px solid var(--muted);border-bottom:2px solid var(--muted);
  transform:rotate(45deg);margin-inline-start:2px;transition:transform .15s}
.rtile[open] summary::after{transform:rotate(225deg)}
.rn{flex:1;font-size:14px}
.rv{direction:ltr;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.rv .unit{font-size:13px;color:var(--muted);font-weight:400}
.rtile .steps{padding:0 12px 12px;margin:0}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
    </div>
    <div class="actions">
      <button class="ghost" id="btn-example" type="button" data-i18n="example"></button>
      <button class="ghost" id="btn-clear" type="button" data-i18n="clear"></button>
      <select class="lang-select" id="lang-select" aria-label="Language">
        <option value="ar">العربية</option>
        <option value="en">English</option>
        <option value="de">Deutsch</option>
      </select>
    </div>
  </header>

  <div class="seg" role="group" aria-label="نوع الحساب">
    <button type="button" data-mode="target" aria-pressed="true" data-i18n="modeTarget"></button>
    <button type="button" data-mode="all" aria-pressed="false" data-i18n="modeAll"></button>
  </div>

  <main class="layout" id="layout">
    <section id="picker" aria-label="المتغير المطلوب"></section>
    <section id="result" aria-live="polite"></section>
    <section id="inputs" aria-label="المعطيات"></section>
  </main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   i18n — كل الترجمات هنا. لإضافة لغة جديدة: ضيف قاموس جديد
   وضيف <option> في الـ select. مفيش أي علاقة بالباك اند.
   ═══════════════════════════════════════════════════════════ */
const I18N = {
  ar: {
    title: "Physics Solver",
    subtitle: "اكتب اللي تعرفه، والباقي يتحسب.",
    example: "مثال",
    clear: "مسح الكل",
    modeTarget: "متغير محدد",
    modeAll: "حساب عام",
    pickLabel: "عايز تحسب إيه؟",
    inputsLabel: "المعطيات",
    inputsHint: "سيب اللي مش معروف فاضي",
    note: "ملاحظة: I هو شدة التيار (A أمبير)، أما A فهو مساحة المقطع (m²).",
    insufficient: "بيانات غير كافية",
    conflictTitle: "تعارض في المدخلات",
    solutionSteps: "طريقة الحل",
    closestEq: "أقرب معادلات — لسه ناقص:",
    results: "النتائج",
    emptyTargetPrefix: "اكتب المعطيات وهيظهر",
    emptyTargetSuffix: "هنا.",
    emptyAll: "اكتب القيم اللي تعرفها، وكل اللي ينفع يتحسب هيظهر هنا.",
    backendError: "خطأ في الاتصال بالخادم!",
    invalidInput: "المدخلات غير صالحة.",
    but: "لكن",
    groupNames: {
      electric: "الكهرباء",
      material: "المادة والأبعاد",
      motion: "الحركة الدورية"
    },
    varNames: {
      Q: "الشحنة", N: "عدد الإلكترونات", I: "شدة التيار", V: "فرق الجهد",
      R: "المقاومة", Pw: "القدرة", W: "الشغل / الطاقة", t: "الزمن",
      rho_e: "المقاومة النوعية", sigma: "التوصيلية الكهربية", L: "الطول",
      A: "مساحة المقطع", r: "نصف القطر", Vol: "الحجم", m: "الكتلة",
      rho: "الكثافة", f: "التردد", T: "الزمن الدوري", v_vel: "السرعة"
    }
  },
  en: {
    title: "Physics Solver",
    subtitle: "Enter what you know, the rest is calculated.",
    example: "Example",
    clear: "Clear All",
    modeTarget: "Target Variable",
    modeAll: "Solve All",
    pickLabel: "What do you want to find?",
    inputsLabel: "Inputs",
    inputsHint: "leave unknown fields empty",
    note: "Note: I is current (A), while A is cross-sectional area (m²).",
    insufficient: "Insufficient data",
    conflictTitle: "Input conflict",
    solutionSteps: "Solution steps",
    closestEq: "Closest equations — still missing:",
    results: "Results",
    emptyTargetPrefix: "Enter inputs and",
    emptyTargetSuffix: "will appear here.",
    emptyAll: "Enter the values you know, and all calculable results will appear here.",
    backendError: "Backend connection error!",
    invalidInput: "Invalid inputs.",
    but: "but",
    groupNames: {
      electric: "Electricity",
      material: "Material & Dimensions",
      motion: "Periodic Motion"
    },
    varNames: {
      Q: "Charge", N: "Electron count", I: "Current", V: "Voltage",
      R: "Resistance", Pw: "Power", W: "Work / Energy", t: "Time",
      rho_e: "Resistivity", sigma: "Conductivity", L: "Length",
      A: "Cross-sectional area", r: "Radius", Vol: "Volume", m: "Mass",
      rho: "Density", f: "Frequency", T: "Period", v_vel: "Velocity"
    }
  },
  de: {
    title: "Physics Solver",
    subtitle: "Geben Sie ein, was Sie wissen — der Rest wird berechnet.",
    example: "Beispiel",
    clear: "Alles löschen",
    modeTarget: "Zielvariable",
    modeAll: "Alles berechnen",
    pickLabel: "Was möchten Sie berechnen?",
    inputsLabel: "Eingaben",
    inputsHint: "Unbekannte Felder leer lassen",
    note: "Hinweis: I ist die Stromstärke (A), A ist die Querschnittsfläche (m²).",
    insufficient: "Unzureichende Daten",
    conflictTitle: "Eingabekonflikt",
    solutionSteps: "Lösungsschritte",
    closestEq: "Nächste Gleichungen — fehlt noch:",
    results: "Ergebnisse",
    emptyTargetPrefix: "Geben Sie Werte ein und",
    emptyTargetSuffix: "erscheint hier.",
    emptyAll: "Geben Sie bekannte Werte ein — alle berechenbaren Ergebnisse erscheinen hier.",
    backendError: "Backend-Verbindungsfehler!",
    invalidInput: "Ungültige Eingaben.",
    but: "aber",
    groupNames: {
      electric: "Elektrizität",
      material: "Material & Abmessungen",
      motion: "Periodische Bewegung"
    },
    varNames: {
      Q: "Ladung", N: "Elektronenanzahl", I: "Stromstärke", V: "Spannung",
      R: "Widerstand", Pw: "Leistung", W: "Arbeit / Energie", t: "Zeit",
      rho_e: "Spezifischer Widerstand", sigma: "Leitfähigkeit", L: "Länge",
      A: "Querschnittsfläche", r: "Radius", Vol: "Volumen", m: "Masse",
      rho: "Dichte", f: "Frequenz", T: "Periodendauer", v_vel: "Geschwindigkeit"
    }
  }
};

const RTL_LANGS = new Set(['ar', 'he', 'fa', 'ur']);

/* ── State ── */
const state = {
  lang: 'ar',
  meta: null,
  byKey: {},
  mode: 'target',
  target: 'Pw',
  open: new Set()
};

const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty = s => esc(s).replace(/e([+-]?)0*(\d+)/g,
  (_, sg, d) => `×10<sup>${sg === '-' ? '−' : ''}${d}</sup>`);

function t(key) {
  return I18N[state.lang][key] ?? I18N.en[key] ?? key;
}
function varName(key) {
  return I18N[state.lang].varNames[key] ?? key;
}
function groupName(id) {
  return I18N[state.lang].groupNames[id] ?? id;
}

const fields = {};
const layoutEl = $('#layout'), pickerEl = $('#picker'),
      resultEl = $('#result'),  inputsEl = $('#inputs');

function symHTML(key, tone = '', size = '') {
  const v = state.byKey[key];
  const cls = ['sym', tone, size, v.symbol.length > 2 ? 'long' : ''].filter(Boolean).join(' ');
  return `<span class="${cls}">${esc(v.symbol)}</span>`;
}

function normalize(raw) {
  return raw.trim()
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/[٫,،]/g, '.')
    .replace(/[٬\s]/g, '')
    .replace(/[−–]/g, '-');
}
function parse(raw) {
  const s = normalize(raw);
  if (s === '') return { empty: true };
  if (!/^[+-]?(\d+\.?\d*|\.\d+)([eE][+-]?\d+)?$/.test(s)) return { bad: true };
  const v = Number(s);
  return Number.isFinite(v) ? { value: v } : { bad: true };
}

/* ── Builders ── */
function buildPicker() {
  pickerEl.innerHTML = `<h2 class="lbl">${esc(t('pickLabel'))}</h2><div class="pick-grid"></div>`;
  const grid = $('.pick-grid', pickerEl);
  for (const v of state.meta.variables) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pick'; b.dataset.key = v.key;
    b.innerHTML = `<span class="s${v.symbol.length > 2 ? ' long' : ''}">${esc(v.symbol)}</span>` +
                  `<span class="n">${esc(varName(v.key))}</span>`;
    b.addEventListener('click', () => { state.target = v.key; syncMode(); run(); });
    grid.appendChild(b);
  }
}

function buildInputs() {
  inputsEl.innerHTML = `<h2 class="lbl">${esc(t('inputsLabel'))}` +
    `<span class="hint">${esc(t('inputsHint'))}</span></h2>`;
  for (const g of state.meta.groups) {
    const sec = document.createElement('section');
    sec.className = 'group';
    sec.innerHTML = `<h3 class="gt">${esc(groupName(g.id))}</h3><div class="fields"></div>`;
    const wrap = $('.fields', sec);
    for (const v of state.meta.variables.filter(x => x.group === g.id)) {
      const el = document.createElement('label');
      el.className = 'field';
      el.innerHTML =
        symHTML(v.key) +
        `<span class="mid"><span class="nm">${esc(varName(v.key))}</span>` +
        `<input type="text" dir="ltr" inputmode="text" autocomplete="off" autocapitalize="off" ` +
        `spellcheck="false" placeholder="—" aria-label="${esc(varName(v.key))} (${esc(v.symbol)})"></span>` +
        `<span class="un">${esc(v.unit)}</span>`;
      const input = $('input', el);
      input.addEventListener('input', () => { paintField(v.key, false); schedule(); });
      input.addEventListener('blur',  () => paintField(v.key, true));
      fields[v.key] = { el, input };
      wrap.appendChild(el);
    }
    inputsEl.appendChild(sec);
  }
  const note = document.createElement('p');
  note.className = 'note';
  note.textContent = t('note');
  inputsEl.appendChild(note);
}

function paintField(key, showBad) {
  const { el, input } = fields[key];
  const p = parse(input.value);
  el.classList.toggle('filled', p.value !== undefined);
  el.classList.toggle('bad', !!p.bad && showBad);
}

function syncMode() {
  const isTarget = state.mode === 'target';
  layoutEl.classList.toggle('mode-all', !isTarget);
  pickerEl.hidden = !isTarget;
  document.querySelectorAll('.seg button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
  document.querySelectorAll('.pick').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.key === state.target)));
  for (const [key, f] of Object.entries(fields)) f.el.hidden = isTarget && key === state.target;
}

function collect() {
  const values = {};
  for (const [key, { input }] of Object.entries(fields)) {
    if (state.mode === 'target' && key === state.target) continue;
    const p = parse(input.value);
    if (p.value !== undefined) values[key] = p.value;
  }
  return values;
}

let timer = null, ctrl = null;
function schedule() { clearTimeout(timer); timer = setTimeout(run, 220); }

async function run() {
  clearTimeout(timer);
  const values = collect();
  if (!Object.keys(values).length) { if (ctrl) ctrl.abort(); renderEmpty(); return; }
  if (ctrl) ctrl.abort();
  ctrl = new AbortController();
  const isTarget = state.mode === 'target';
  try {
    const res = await fetch(isTarget ? '/api/calculate' : '/api/solve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(isTarget ? { target: state.target, values } : { values }),
      signal: ctrl.signal,
    });
    const data = await res.json();
    if (!res.ok) {
      renderError(typeof data.detail === 'string' ? data.detail : t('invalidInput'));
      return;
    }
    isTarget ? renderTarget(data) : renderAll(data);
  } catch (err) {
    if (err.name === 'AbortError') return;
    renderError(t('backendError'));
  }
}

/* ── Renderers ── */
function stepsHTML(steps) {
  if (!steps || !steps.length) return '';
  return `<h3 class="sub">${esc(t('solutionSteps'))}</h3><ul class="steps">` + steps.map(s =>
    `<li><div class="f">${pretty(s.formula)}</div>` +
    `<div class="v">${pretty(s.substituted)} = <b>${pretty(s.display)} ${esc(s.unit)}</b></div></li>`
  ).join('') + '</ul>';
}

function conflictsHTML(list) {
  if (!list || !list.length) return '';
  return `<div class="warn"><strong>${esc(t('conflictTitle'))}</strong><ul>` + list.map(c =>
    `<li>${esc(c.symbol)} = <bdi dir="ltr"><b>${pretty(c.stored)} ${esc(c.unit)}</b></bdi> — ${esc(t('but'))} ` +
    `<bdi dir="ltr">${pretty(c.formula)} = <b>${pretty(c.expected)} ${esc(c.unit)}</b></bdi></li>`
  ).join('') + '</ul></div>';
}

function renderEmpty() {
  if (state.mode === 'target') {
    resultEl.innerHTML = `<div class="card empty">${symHTML(state.target, 's', 'big')}` +
      `<p>${esc(t('emptyTargetPrefix'))} ${esc(varName(state.target))} ${esc(t('emptyTargetSuffix'))}</p></div>`;
  } else {
    resultEl.innerHTML = `<div class="card empty"><p>${esc(t('emptyAll'))}</p></div>`;
  }
}

function renderError(msg) {
  resultEl.innerHTML = `<div class="card bad"><p>${esc(msg)}</p></div>`;
}

function renderTarget(d) {
  if (!d.ok) {
    const hints = (d.hints || []).length
      ? `<h3 class="sub">${esc(t('closestEq'))}</h3><ul class="hints">` + d.hints.map(h =>
          `<li><bdi class="f" dir="ltr">${pretty(h.formula)}</bdi>` +
          `<span class="miss">${h.missing.map(k => symHTML(k, 'a', 'sm')).join('')}</span></li>`
        ).join('') + '</ul>'
      : '';
    resultEl.innerHTML = `<div class="card bad"><div class="res-head">${symHTML(d.target, 'a', 'big')}` +
      `<div><div class="res-name">${esc(varName(d.target))}</div>` +
      `<div class="insuff">${esc(t('insufficient'))}</div></div></div>` +
      hints + conflictsHTML(d.conflicts) + '</div>';
    return;
  }
  resultEl.innerHTML = `<div class="card ok"><div class="res-head">${symHTML(d.target, 's', 'big')}` +
    `<div><div class="res-name">${esc(varName(d.target))}</div>` +
    `<div class="res-val"><span class="num">${pretty(d.display)}</span><span class="unit">${esc(d.unit)}</span></div></div></div>` +
    stepsHTML(d.steps) + conflictsHTML(d.conflicts) + '</div>';
}

function renderAll(d) {
  if (!d.ok) {
    resultEl.innerHTML = `<div class="card bad"><div class="insuff">${esc(t('insufficient'))}</div>` +
      conflictsHTML(d.conflicts) + '</div>';
    return;
  }
  const tiles = d.derived.map(x =>
    `<details class="rtile" data-key="${esc(x.key)}"${state.open.has(x.key) ? ' open' : ''}>` +
    `<summary>${symHTML(x.key, 's', 'sm')}<span class="rn">${esc(varName(x.key))}</span>` +
    `<span class="rv"><span>${pretty(x.display)}</span> <span class="unit">${esc(x.unit)}</span></span></summary>` +
    stepsHTML(x.steps) + '</details>').join('');
  resultEl.innerHTML = `<div class="card ok"><div class="all-head"><h2>${esc(t('results'))}</h2>` +
    `<span class="chip">${d.derived.length}</span></div><div class="rlist">${tiles}</div>` +
    conflictsHTML(d.conflicts) + '</div>';
}

/* ── Language switching ── */
function applyLang(lang) {
  state.lang = lang;
  const html = document.documentElement;
  html.lang = lang;
  html.dir = RTL_LANGS.has(lang) ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });

  // Rebuild dynamic parts
  if (state.meta) {
    buildPicker();
    buildInputs();
    syncMode();
    run();
  }
}

/* ── Events ── */
resultEl.addEventListener('toggle', e => {
  const k = e.target.dataset && e.target.dataset.key;
  if (!k) return;
  e.target.open ? state.open.add(k) : state.open.delete(k);
}, true);

document.querySelectorAll('.seg button').forEach(b =>
  b.addEventListener('click', () => { state.mode = b.dataset.mode; syncMode(); run(); }));

function setAll(map) {
  for (const [key, f] of Object.entries(fields)) {
    f.input.value = map[key] ?? '';
    paintField(key, false);
  }
  run();
}
$('#btn-clear').addEventListener('click', () => setAll({}));
$('#btn-example').addEventListener('click', () => setAll({ V: '10', R: '5', t: '3' }));

$('#lang-select').addEventListener('change', e => applyLang(e.target.value));

/* ── Init ── */
(async () => {
  applyLang('ar');
  try {
    const res = await fetch('/api/variables');
    state.meta = await res.json();
    state.meta.variables.forEach(v => { state.byKey[v.key] = v; });
    buildPicker(); buildInputs(); syncMode(); renderEmpty();
    const sel = $('.pick[aria-pressed="true"]');
    if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
  } catch (err) {
    renderError(t('backendError'));
  }
})();
</script>
</body>
</html>
